<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistoria Informatizada</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth.js"></script>
  <script>
    // Redirecionamento automático baseado na sessão do usuário
    document.addEventListener('DOMContentLoaded', () => {
      const usuario = AUTH.getUsuario();
      if (usuario) {
        // Se for analista e vistorias ainda estiver sendo feito, vai para vistorias ou usuarios
        window.location.replace('/vistorias.html');
      } else {
        window.location.replace('/login.html');
      }
    });
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="card" style="max-width: 480px; width: 100%; text-align: center; padding: 2rem;">
      <div class="auth-icon" style="margin: 0 auto 1rem;">V</div>
      <h1 class="page-title" style="font-size: 1.4rem;">Vistoria Informatizada</h1>
      <p class="text-muted mt-2">Redirecionando para o sistema...</p>
      
      <div class="mt-4" style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
        <a href="/login.html" class="btn btn-primary">Ir para o Login</a>
        <a href="/usuarios.html" class="btn btn-secondary">Gestão de Usuários</a>
      </div>
    </div>
  </div>
</body>
</html>
