<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistoria Informatizada</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const usuario = AUTH.getUsuario();
      if (usuario) {
        window.location.replace('vistorias.html');
      } else {
        window.location.replace('login.html');
      }
    });
  </script>
</head>
<body>
  <main class="container texto-centralizado estado-carregamento">
    <p>Redirecionando...</p>
  </main>
</body>
</html>
