<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistorias - Vistoria Informatizada</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-conteudo">
      <a href="index.html" class="navbar-marca">Vistoria Informatizada</a>
      <nav class="navbar-links">
        <a href="vistorias.html" class="ativo">Vistorias</a>
        <a href="vistoria-detalhes.html">Detalhes da Vistoria</a>
        <a href="ocorrencias.html">Histórico de Ocorrências</a>
        <a href="usuarios.html" id="linkUsuarios" class="oculto">Usuários</a>
      </nav>
      <div class="navbar-usuario">
        <span id="nomeUsuario"></span>
        <button type="button" id="btnSair" class="btn btn-pequeno btn-navbar">Sair</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="cabecalho-pagina">
      <div>
        <h1>Vistorias</h1>
        <p class="subtitulo" id="totalVistorias"></p>
      </div>
      <a href="vistoria-form.html" id="btnNova" class="btn btn-primario oculto">+ Nova vistoria</a>
    </div>

    <section class="card">
      <div class="filtros">
        <div class="form-grupo">
          <label for="filtroStatus">Status</label>
          <select id="filtroStatus" class="form-controle">
            <option value="">Todos</option>
            <option value="ABERTA">Aberta</option>
            <option value="FINALIZADA">Finalizada</option>
          </select>
        </div>
        <div class="form-grupo">
          <label for="filtroEndereco">Endereço</label>
          <input type="text" id="filtroEndereco" class="form-controle" placeholder="Ex.: Rua das Flores">
        </div>
        <div>
          <button type="button" id="btnFiltrar" class="btn btn-primario">Filtrar</button>
          <button type="button" id="btnLimpar" class="btn btn-com-espacamento-esquerdo">Limpar</button>
        </div>
      </div>
    </section>

    <div id="mensagem" class="alerta oculto"></div>
    <div id="carregando" class="subtitulo estado-carregamento">Carregando vistorias...</div>

    <!-- Os cartões de vistorias são inseridos aqui pelo vistorias.js -->
    <div id="listaVistorias"></div>
    <div id="vazio" class="oculto subtitulo estado-vazio">Nenhuma vistoria encontrada.</div>

    <!-- Modal de confirmação de exclusão -->
    <div id="modalExcluir" class="oculto modal-fundo">
      <div class="card modal-caixa-vistoria">
        <div class="card-titulo">Excluir vistoria</div>
        <p>Deseja excluir a vistoria <strong id="excluirCodigo"></strong>?</p>
        <p class="subtitulo modal-dica" id="excluirEndereco"></p>
        <p class="aviso-exclusao">⚠️ As fotos e ocorrências desta vistoria também serão excluídas.</p>
        <div class="acoes-linha margem-topo acoes-finalizadas">
          <button type="button" id="btnCancelarExcluir" class="btn">Cancelar</button>
          <button type="button" id="btnConfirmarExcluir" class="btn btn-perigo">Excluir</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/vistorias.js"></script>
</body>
</html>
