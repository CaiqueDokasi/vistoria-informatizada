<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de vistoria - Vistoria Informatizada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/vistorias.css" rel="stylesheet">
</head>
<body>

  <!-- Menu superior -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="vistorias.html">
        <i class="bi bi-clipboard-check"></i> Vistoria Informatizada
      </a>
      <div class="d-flex align-items-center gap-3 text-white">
        <span><i class="bi bi-person-circle"></i> <span id="nomeUsuario"></span>
          <small class="opacity-75">(<span id="cargoUsuario"></span>)</small></span>
        <button id="btnSair" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 760px;">

    <!-- Caminho e título (o texto muda entre "Nova" e "Editar") -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="vistorias.html">Vistorias</a></li>
        <li class="breadcrumb-item active" id="caminhoAtual">Nova vistoria</li>
      </ol>
    </nav>
    <h1 class="h3 mb-4" id="titulo">Nova vistoria</h1>

    <div id="mensagem"></div>

    <!-- novalidate: a validação é feita pelo JavaScript com o visual do Bootstrap -->
    <form id="formVistoria" class="card card-body" novalidate>

      <div class="mb-3">
        <label for="endereco" class="form-label">Endereço *</label>
        <input type="text" id="endereco" class="form-control" maxlength="255" required
               placeholder="Ex.: Rua das Flores, 123 - Apto 101 - Centro">
        <div class="invalid-feedback">Informe o endereço do local.</div>
      </div>

      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição *</label>
        <textarea id="descricao" class="form-control" rows="4" required
                  placeholder="O que deve ser verificado nesta vistoria?"></textarea>
        <div class="invalid-feedback">Informe a descrição da vistoria.</div>
      </div>

      <div class="row">
        <div class="col-md mb-3">
          <label for="operador" class="form-label">Operador responsável *</label>
          <select id="operador" class="form-select" required>
            <option value="">Carregando...</option>
          </select>
          <div class="invalid-feedback">Escolha o operador responsável.</div>
        </div>

        <!-- Status: só aparece na edição -->
        <div class="col-md-4 mb-3 d-none" id="grupoStatus">
          <label for="status" class="form-label">Status *</label>
          <select id="status" class="form-select">
            <option value="ABERTA">Aberta</option>
            <option value="FINALIZADA">Finalizada</option>
          </select>
        </div>
      </div>

      <!-- Fotos já cadastradas: só aparece na edição -->
      <div class="mb-3 d-none" id="grupoFotos">
        <label class="form-label">Fotos cadastradas</label>
        <div id="fotosAtuais" class="d-flex flex-wrap gap-2"></div>
      </div>

      <div class="mb-3">
        <label for="urlFoto" class="form-label" id="rotuloFoto">Link da foto do local</label>
        <input type="url" id="urlFoto" class="form-control" placeholder="https://...">
        <div class="invalid-feedback">Informe um link válido, começando com http:// ou https://</div>
        <div class="form-text" id="ajudaFoto">Opcional. Cole o endereço de uma imagem da internet.</div>
        <img id="previewFoto" class="preview-foto img-thumbnail mt-2 d-none" alt="Pré-visualização da foto">
      </div>

      <div class="d-flex justify-content-end gap-2 mt-2">
        <a href="vistorias.html" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" id="btnSalvar" class="btn btn-primary">
          <i class="bi bi-check-lg"></i> Salvar
        </button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/vistoria-form.js"></script>
</body>
</html>
